<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d29"><title>BSHUSHU — Ваш подарок</title><style>body{margin:0;background:#e9efe6;color:#173f29;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;display:grid;min-height:100dvh;place-items:center;padding:20px;box-sizing:border-box}main{width:min(420px,100%);background:white;border-radius:28px;padding:30px 24px;box-sizing:border-box;box-shadow:0 16px 55px #163b2820;text-align:center}.brand{letter-spacing:3px;font-size:13px;font-weight:900}h1{font-size:30px;margin:25px 0 8px}.gift{font-size:24px;font-weight:800;margin:16px 0 25px}.status{font-size:15px;color:#577061;min-height:45px}input{width:100%;box-sizing:border-box;border:1px solid #bdcfc0;border-radius:13px;font-size:23px;letter-spacing:8px;text-align:center;padding:14px}button{width:100%;background:#174d29;color:white;border:0;border-radius:14px;font-size:16px;font-weight:750;padding:17px;margin-top:13px}button:disabled{opacity:.5}.note{font-size:12px;color:#68796b;margin-top:19px}</style><main><div class="brand">✈ BSHUSHU FLIGHT CLUB</div><h1>Ваш подарок 🎁</h1><div class="gift" id="gift">Загрузка...</div><p class="status" id="status"></p><section id="redeem" hidden><p>Покажите страницу сотруднику BSHUSHU. Сотрудник вводит код недели:</p><input id="pin" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="000"><button id="btn">Погасить подарок</button></section><div class="note">Подарок можно получить только один раз.</div></main><script>const code=new URLSearchParams(location.search).get('code')||'';const status=document.getElementById('status');const gift=document.getElementById('gift');const section=document.getElementById('redeem');async function api(body){const r=await fetch('https://vtllofdosyrfqdqrjwwg.supabase.co/functions/v1/bshushu-prize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return r.json()}async function init(){if(!/^[a-z0-9-]{6,64}$/i.test(code)){gift.textContent='Ссылка недействительна';return}try{const d=await api({action:'info',code});if(!d.found){gift.textContent='Подарок не найден';return}gift.textContent=d.gift;status.textContent=d.redeemed?'✅ Подарок уже получен':'🏆 '+d.place+' место · Подарок готов к выдаче';section.hidden=!!d.redeemed}catch(e){gift.textContent='Не удалось загрузить подарок'}}document.getElementById('btn').onclick=async()=>{const pin=document.getElementById('pin').value.trim();if(!/^\d{3}$/.test(pin)){status.textContent='Введите трёхзначный код сотрудника';return}const b=document.getElementById('btn');b.disabled=true;try{const d=await api({action:'redeem',code,pin});status.textContent=d.ok?'✅ Подарок погашен':(d.error||'Ошибка погашения');if(d.ok)section.hidden=true}catch(e){status.textContent='Ошибка соединения'}finally{b.disabled=false}};init();</script></html>
